services:
  - type: web
    name: warungwise-demo
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_demo.py && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: WARUNGWISE_DATABASE
        value: instance/warungwise-demo.db
      - key: WARUNGWISE_DEMO_READ_ONLY
        value: "true"
      - key: WARUNGWISE_SECRET_KEY
        generateValue: true
